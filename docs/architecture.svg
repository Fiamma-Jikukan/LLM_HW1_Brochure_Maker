<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="880" viewBox="0 0 1280 880" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D14343"/>
    </marker>
    <style>
      .title { font-size: 22px; font-weight: 700; fill: #111827; }
      .panel-title { font-size: 15px; font-weight: 700; fill: #374151; }
      .h { font-size: 14px; font-weight: 700; fill: #111827; }
      .d { font-size: 11.5px; fill: #374151; }
      .f { font-size: 12px; fill: #374151; font-family: Consolas, Menlo, monospace; }
      .small { font-size: 11.5px; fill: #4B5563; }
      .lbl { font-size: 11.5px; fill: #4B5563; font-style: italic; }
      .code { fill: #E8F0FE; stroke: #3B6FD8; stroke-width: 1.5; }
      .model { fill: #FFF1E0; stroke: #E07B00; stroke-width: 1.8; }
      .file { fill: #F3F4F6; stroke: #9CA3AF; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .guard { fill: #FDECEC; stroke: #D14343; stroke-width: 1.5; }
      .result { fill: #F3E8FF; stroke: #8B5CF6; stroke-width: 1.5; }
      .human { fill: #E7F6EC; stroke: #2F9E5B; stroke-width: 1.5; }
      .panel { fill: #FFFFFF; stroke: #D1D5DB; stroke-width: 1.2; }
      .band { fill: #F9FAFB; stroke: #9CA3AF; stroke-width: 1.2; }
      .pill-site { fill: #0E8A7E; }
      .pill-model { fill: #E07B00; }
      .pill-text { font-size: 10.5px; font-weight: 700; fill: #FFFFFF; }
      .flow { stroke: #4B5563; stroke-width: 1.6; fill: none; }
      .save { stroke: #9CA3AF; stroke-width: 1.3; fill: none; stroke-dasharray: 4 3; }
    </style>
  </defs>

  <rect width="1280" height="880" fill="#FFFFFF"/>
  <text x="20" y="36" class="title">Company Brochure Maker: architecture (a fixed workflow)</text>

  <!-- Config band -->
  <rect x="20" y="52" width="1240" height="48" rx="8" class="band"/>
  <text x="36" y="72" class="h">config.py</text>
  <text x="120" y="72" class="d">one OpenAI SDK client → api.anthropic.com/v1 · model claude-opus-5-5 · max_retries=0 · key from .env (never logged)</text>
  <text x="120" y="90" class="d">two companies (A, B) · 2 audiences · 4 comparison dimensions · 12,000-char context budget · 200–300 words · ≤3 extra pages</text>

  <!-- Panels -->
  <rect x="20" y="116" width="610" height="548" rx="10" class="panel"/>
  <text x="36" y="140" class="panel-title">A. Per company (×2): runs once, result saved</text>
  <rect x="650" y="116" width="610" height="548" rx="10" class="panel"/>
  <text x="666" y="140" class="panel-title">B. Per output (×6): built only from the saved sources</text>
  <text x="666" y="158" class="d"><tspan font-weight="700">4 brochures + baseline:</tspan> one company's sources ·  <tspan font-weight="700">comparison:</tspan> A + B together, after both are collected</text>

  <!-- ===== Left panel ===== -->
  <!-- 1 fetch_home -->
  <rect x="40" y="158" width="360" height="62" rx="8" class="code"/>
  <text x="54" y="181" class="h">1  fetch_home</text>
  <rect x="300" y="167" width="88" height="18" rx="9" class="pill-site"/>
  <text x="344" y="180" class="pill-text" text-anchor="middle">site request</text>
  <text x="54" y="201" class="d">scraper.fetch_page: one request → full text, links,</text>
  <text x="54" y="215" class="d">HTTP status, final URL after redirects</text>

  <!-- 2 build_candidates -->
  <rect x="40" y="244" width="360" height="82" rx="8" class="code"/>
  <text x="54" y="267" class="h">2  build_candidates</text>
  <text x="54" y="286" class="d">resolve links · drop #fragment, mailto / tel / javascript</text>
  <text x="54" y="301" class="d">same site only (www = same) · drop home, privacy /</text>
  <text x="54" y="316" class="d">terms, file links · drop duplicates</text>
  <rect x="430" y="267" width="180" height="36" rx="6" class="file"/>
  <text x="520" y="290" class="f" text-anchor="middle">candidates/&lt;co&gt;.json</text>
  <path d="M400,285 L428,285" class="save" marker-end="url(#arrow)"/>

  <!-- 3 select_links -->
  <rect x="40" y="350" width="360" height="62" rx="8" class="model"/>
  <text x="54" y="373" class="h">3  select_links</text>
  <rect x="300" y="359" width="88" height="18" rx="9" class="pill-model"/>
  <text x="344" y="372" class="pill-text" text-anchor="middle">Claude call</text>
  <text x="54" y="393" class="d">prompt → Claude (json_schema, strict) → ≤3 pages,</text>
  <text x="54" y="407" class="d">each with type, url, reason → validate_selection (code)</text>
  <rect x="430" y="363" width="180" height="36" rx="6" class="file"/>
  <text x="520" y="386" class="f" text-anchor="middle">selections/&lt;co&gt;.json</text>
  <path d="M400,381 L428,381" class="save" marker-end="url(#arrow)"/>

  <!-- guard -->
  <polygon points="220,432 268,456 220,480 172,456" class="guard"/>
  <text x="220" y="460" class="h" text-anchor="middle" style="font-size:12.5px">valid?</text>
  <rect x="300" y="438" width="310" height="38" rx="8" class="guard"/>
  <text x="314" y="455" class="d">rejected: whole answer refused, reasons saved,</text>
  <text x="314" y="469" class="d">nothing fetched (links_to_fetch guard)</text>
  <path d="M268,456 L298,456" class="flow" style="stroke:#D14343" marker-end="url(#arrow-red)"/>
  <text x="272" y="450" class="lbl" style="fill:#D14343">no</text>

  <!-- 4 collect_sources -->
  <rect x="40" y="504" width="360" height="76" rx="8" class="code"/>
  <text x="54" y="527" class="h">4  collect_sources</text>
  <rect x="300" y="513" width="88" height="18" rx="9" class="pill-site"/>
  <text x="344" y="526" class="pill-text" text-anchor="middle">site request</text>
  <text x="54" y="547" class="d">fetch ≤3 accepted pages, 1 s apart · IDs A1–A4 / B1–B4</text>
  <text x="54" y="562" class="d">(home = A1 / B1) · status ok / empty / failed</text>
  <text x="54" y="576" class="d">(empty and failed are kept, never used as evidence)</text>
  <rect x="430" y="524" width="180" height="36" rx="6" class="file"/>
  <text x="520" y="547" class="f" text-anchor="middle">sources/&lt;co&gt;.json</text>
  <path d="M400,542 L428,542" class="save" marker-end="url(#arrow)"/>

  <text x="40" y="610" class="small">The home page is fetched once: its links feed step 2 and its text becomes A1 / B1.</text>
  <text x="40" y="628" class="small">The model only chooses links; code builds the list and checks the choice.</text>

  <!-- left flow arrows -->
  <path d="M220,220 L220,242" class="flow" marker-end="url(#arrow)"/>
  <path d="M220,326 L220,348" class="flow" marker-end="url(#arrow)"/>
  <path d="M220,412 L220,430" class="flow" marker-end="url(#arrow)"/>
  <path d="M220,480 L220,502" class="flow" marker-end="url(#arrow)"/>
  <text x="228" y="496" class="lbl">yes</text>

  <!-- bridge: saved sources -> context -->
  <path d="M610,542 L640,542 L640,210 L668,210" class="flow" marker-end="url(#arrow)"/>

  <!-- ===== Right panel (shifted down to make room for the subtitle) ===== -->
  <g transform="translate(0,14)">
  <!-- 5 build_context -->
  <rect x="670" y="158" width="360" height="78" rx="8" class="code"/>
  <text x="684" y="181" class="h">5  build_context</text>
  <text x="684" y="200" class="d">only "ok" sources · 12,000-char budget, fair split</text>
  <text x="684" y="215" class="d">(a long page is shortened; it can't push others out)</text>
  <text x="684" y="230" class="d">comparison: A + B share one budget · IDs never cut</text>
  <rect x="1060" y="179" width="180" height="36" rx="6" class="file"/>
  <text x="1150" y="202" class="f" text-anchor="middle">contexts/&lt;name&gt;</text>
  <path d="M1030,197 L1058,197" class="save" marker-end="url(#arrow)"/>

  <!-- 6 prompts -->
  <rect x="670" y="260" width="360" height="62" rx="8" class="code"/>
  <text x="684" y="283" class="h">6  prompts (text only)</text>
  <text x="684" y="302" class="d">customers / candidates (own structure) · baseline ·</text>
  <text x="684" y="316" class="d">comparison · same source &amp; citation rules in all</text>
  <rect x="1060" y="273" width="180" height="36" rx="6" class="file"/>
  <text x="1150" y="296" class="f" text-anchor="middle">prompts/&lt;name&gt;.json</text>
  <path d="M1030,291 L1058,291" class="save" marker-end="url(#arrow)"/>

  <!-- 7 generate -->
  <rect x="670" y="346" width="360" height="62" rx="8" class="model"/>
  <text x="684" y="369" class="h">7  generate</text>
  <rect x="930" y="355" width="88" height="18" rx="9" class="pill-model"/>
  <text x="974" y="368" class="pill-text" text-anchor="middle">Claude call</text>
  <text x="684" y="389" class="d">one call each, no retries · one brochure streamed</text>
  <text x="684" y="403" class="d">(accumulate_stream → complete / partial / failed)</text>
  <rect x="1060" y="359" width="180" height="36" rx="6" class="file"/>
  <text x="1150" y="382" class="f" text-anchor="middle">outputs/&lt;name&gt;.md</text>
  <path d="M1030,377 L1058,377" class="save" marker-end="url(#arrow)"/>

  <!-- 8 checks -->
  <rect x="670" y="432" width="360" height="62" rx="8" class="code"/>
  <text x="684" y="455" class="h">8  checks</text>
  <text x="684" y="474" class="d">cited IDs ⊆ this call's context · source-list URLs ·</text>
  <text x="684" y="488" class="d">200–300 words (split) · headings · 4 dimensions</text>
  <rect x="1060" y="445" width="180" height="36" rx="6" class="file"/>
  <text x="1150" y="468" class="f" text-anchor="middle">outputs/&lt;name&gt;.json</text>
  <path d="M1030,463 L1058,463" class="save" marker-end="url(#arrow)"/>

  <!-- results -->
  <rect x="670" y="518" width="570" height="50" rx="8" class="result"/>
  <text x="684" y="539" class="h">Outputs (Hebrew, cited [A2]-style, with source list)</text>
  <text x="684" y="558" class="d">4 brochures (2 companies × customers / candidates) · comparison table (A vs B) · baseline brochure</text>

  <!-- human -->
  <rect x="670" y="592" width="570" height="54" rx="8" class="human"/>
  <text x="684" y="614" class="h">Manual review (people, not code)</text>
  <text x="684" y="633" class="d">8-claim audit (does the source really support it?) · prompt experiment: baseline vs improved</text>

  <!-- right flow arrows -->
  <path d="M850,236 L850,258" class="flow" marker-end="url(#arrow)"/>
  <path d="M850,322 L850,344" class="flow" marker-end="url(#arrow)"/>
  <path d="M850,408 L850,430" class="flow" marker-end="url(#arrow)"/>
  <path d="M850,494 L850,516" class="flow" marker-end="url(#arrow)"/>
  <path d="M850,568 L850,590" class="flow" marker-end="url(#arrow)"/>
  </g>

  <!-- Run log band -->
  <rect x="20" y="680" width="1240" height="66" rx="8" class="band"/>
  <text x="36" y="702" class="h">runlog.RunLog: runs/&lt;run_id&gt;/</text>
  <text x="270" y="702" class="d">log.jsonl: every model call (action, company, audience, attempt, duration, status, tokens if reported,</text>
  <text x="270" y="718" class="d">input → output paths) and every site request, counted separately · run.json (settings) · summary.json</text>
  <text x="270" y="734" class="d">repeated call → "_attempt2" files, nothing overwritten · mask_secrets: the API key never reaches a file</text>

  <text x="20" y="772" class="small"><tspan font-weight="700">Model calls per run:</tspan> 2 link selections + 4 brochures + 1 comparison + 1 baseline = 8.   <tspan font-weight="700">Replay:</tspan> checks re-run from saved files with no model calls.</text>

  <!-- Legend -->
  <text x="20" y="808" class="h">Legend</text>
  <rect x="20" y="820" width="26" height="18" rx="4" class="code"/><text x="54" y="834" class="d">code (deterministic)</text>
  <rect x="200" y="820" width="26" height="18" rx="4" class="model"/><text x="234" y="834" class="d">step with a Claude call</text>
  <rect x="400" y="822" width="70" height="16" rx="8" class="pill-site"/><text x="435" y="834" class="pill-text" text-anchor="middle">site</text><text x="478" y="834" class="d">request to a company site</text>
  <rect x="660" y="820" width="26" height="18" rx="4" class="file"/><text x="694" y="834" class="d">saved file</text>
  <rect x="790" y="820" width="26" height="18" rx="4" class="guard"/><text x="824" y="834" class="d">validation / stop</text>
  <rect x="950" y="820" width="26" height="18" rx="4" class="result"/><text x="984" y="834" class="d">deliverable</text>
  <rect x="1080" y="820" width="26" height="18" rx="4" class="human"/><text x="1114" y="834" class="d">manual step</text>
</svg>
